# Carix — OCI 배포 전용 오케스트레이션.
# 로컬에서 `docker compose up`으로 쓰지 않는다. Docker와 PostgreSQL은 OCI 서버에서만 기동한다.
# 로컬 개발은 순수 코드로 하고, 백엔드는 OCI의 carix DB(운영과 같은 DB)에 원격 연결한다
# (README 개발 환경 참조).
#
# 이미지는 GitHub Actions(ubuntu-24.04-arm)가 빌드해 GHCR에 올린다. 서버는 pull만 한다.
# CORE_API_TAG / FRONTEND_TAG 는 배포 워크플로가 커밋 SHA로 서버 .env에 기록한다.
# 컴포넌트별로 나뉘어 있어, 한쪽만 바뀐 커밋에서는 그쪽 태그만 갱신되고 반대쪽 컨테이너는
# 재생성되지 않는다. compose 가 이미지 태그가 그대로인 서비스를 건드리지 않기 때문이다.
#
# 엣지는 2단이다.
#   - 서버의 라우터 Caddy(~/infra): 80/443 소유, TLS 종료, 호스트명 분기
#   - 이 compose의 carix-caddy: Carix 애플리케이션 라우팅 (deploy/caddy/Caddyfile)
# 라우터가 참조하는 항목은 deploy/caddy/router.caddy 에 있다.
#
# spring-batch 는 없다. 배치 코드가 아직 없어서 core-api 와 같은 이미지로 두 번째 웹 서버가
# 아무 일도 하지 않으며 JVM 힙만 차지했다. 메모리가 빠듯한 공유 호스트다.
# Spring Batch 도입 시 되살린다 — 그때 상주 스케줄러인지 원샷 잡인지도 함께 정한다.
services:
  carix-caddy:
    image: caddy:2-alpine
    container_name: carix_caddy
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    networks:
      - default
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend-node:
    image: ghcr.io/seohyeokgyu/carix/frontend:${FRONTEND_TAG:-latest}
    environment:
      - NODE_ENV=production
      - API_ORIGIN=http://gateway:8080
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  config-server:
    image: ghcr.io/seohyeokgyu/carix/config-server:${CONFIG_SERVER_TAG:-latest}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    volumes:
      # 서버의 저장소 체크아웃. 배포 스크립트의 git reset --hard 가 이 내용을 갱신한다.
      # 라우터 Caddy 가 같은 경로를 마운트하는 것과 같은 방식이다.
      - /home/opc/carix:/etc/carix-repo:ro
    ports:
      # 호스트 8888 은 infra-dozzle-1 이 0.0.0.0 에 이미 잡고 있다. 컨테이너 내부는
      # 8888 그대로 — Eureka 에 등록되고 core-api 가 붙는 것은 내부 포트다.
      - "127.0.0.1:8890:8888"
    mem_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  eureka:
    image: ghcr.io/seohyeokgyu/carix/eureka:${EUREKA_TAG:-latest}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    ports:
      - "127.0.0.1:8761:8761"
    mem_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  gateway:
    image: ghcr.io/seohyeokgyu/carix/gateway:${GATEWAY_TAG:-latest}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    expose:
      - "8080"
    depends_on:
      - config-server
      - eureka
      - core-api
      - auth-service
    mem_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  auth-service:
    image: ghcr.io/seohyeokgyu/carix/auth-service:${AUTH_SERVICE_TAG:-latest}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    expose:
      - "8081"
    depends_on:
      - postgres
      - config-server
      - eureka
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  core-api:
    image: ghcr.io/seohyeokgyu/carix/core-api:${CORE_API_TAG:-latest}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - CARIX_ENCRYPTION_KEY=${CARIX_ENCRYPTION_KEY}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    expose:
      - "8082"
    depends_on:
      - postgres
      - config-server
      - eureka
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - carix-pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql-hba/pg_hba.conf:ro
      # 인증서·개인키는 git 밖, 서버 전용 경로(/home/opc/carix-secrets/postgres/)에 둔다.
      # .env 와 같은 취급 — 저장소에 커밋하지 않는다.
      # long-form + create_host_path: false — 파일이 없으면 Docker가 빈 디렉터리를 대신
      # 만들어 버리는 대신 기동을 바로 실패시킨다(짧은 형식은 조용히 빈 디렉터리를 만든다).
      - type: bind
        source: /home/opc/carix-secrets/postgres/server.crt
        target: /etc/postgresql-certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/opc/carix-secrets/postgres/server.key
        target: /etc/postgresql-certs/server.key
        read_only: true
        bind:
          create_host_path: false
    # command 의 -c 플래그가 데이터 볼륨 안 postgresql.conf 보다 우선한다 — hba_file 을
    # 이 파일로 못박아, 볼륨 안 기본 pg_hba.conf(더 이상 안 쓰임)와 드리프트가 안 생긴다.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql-certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql-certs/server.key
      - -c
      - hba_file=/etc/postgresql-hba/pg_hba.conf
    # 의도적으로 0.0.0.0 바인딩 (2026-08-02, Headscale tailnet 제거 후 대체 경로).
    #
    # Docker 가 발행한 포트는 호스트 firewalld/iptables 를 우회한다(DOCKER 체인) — 그래서
    # 호스트 방화벽으로는 이 포트를 못 막는다. 실제 접근 제어는 이 host 밖, OCI VCN
    # Security List 에서 한다(TCP 5432, 특정 IP CIDR만 허용 — OCI 콘솔/CLI로 관리, 이
    # 저장소 밖). Security List 는 Docker 의 iptables 조작보다 앞단이라 우회되지 않는다.
    #
    # 이중 방어: TLS 도 강제한다(deploy/postgres/pg_hba.conf) — Security List 규칙이
    # 실수로 넓어지더라도 외부 연결은 hostssl 로 여전히 암호화 없이는 안 붙는다.
    ports:
      - "5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  carix-pgdata:
