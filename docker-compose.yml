# Carix — OCI 배포 전용 오케스트레이션.
# 로컬에서 `docker compose up`으로 쓰지 않는다. Docker와 PostgreSQL은 OCI 서버에서만 기동한다.
# 로컬 개발은 순수 코드로 하고, 백엔드는 OCI dev DB에 원격 연결한다 (README 개발 환경 참조).
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-node
      - spring-api
    restart: unless-stopped

  frontend-node:
    build: ./frontend
    environment:
      - NODE_ENV=production
      - API_ORIGIN=http://spring-api:8080
    expose:
      - "3000"
    restart: unless-stopped

  spring-api:
    build: ./backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - CARIX_ENCRYPTION_KEY=${CARIX_ENCRYPTION_KEY}
    expose:
      - "8080"
    depends_on:
      - postgres
    restart: unless-stopped

  spring-batch:
    build: ./backend
    command: ["--spring.batch.job.enabled=true", "--carix.role=batch"]
    environment:
      - SPRING_PROFILES_ACTIVE=prod,batch
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - CARIX_ENCRYPTION_KEY=${CARIX_ENCRYPTION_KEY}
      - KOSIS_API_KEY=${KOSIS_API_KEY}
      - WORK24_API_KEY=${WORK24_API_KEY}
      - SARAMIN_API_KEY=${SARAMIN_API_KEY}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - carix-pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

volumes:
  carix-pgdata:
