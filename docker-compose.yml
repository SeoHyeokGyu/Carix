# Carix — OCI 배포 전용 오케스트레이션.
# 로컬에서 `docker compose up`으로 쓰지 않는다. Docker와 PostgreSQL은 OCI 서버에서만 기동한다.
# 로컬 개발은 순수 코드로 하고, 백엔드는 OCI dev DB에 원격 연결한다 (README 개발 환경 참조).
#
# 이미지는 GitHub Actions(ubuntu-24.04-arm)가 빌드해 GHCR에 올린다. 서버는 pull만 한다.
# BACKEND_TAG / FRONTEND_TAG 는 배포 워크플로가 커밋 SHA로 서버 .env에 기록한다.
# 컴포넌트별로 나뉘어 있어, 한쪽만 바뀐 커밋에서는 그쪽 태그만 갱신되고 반대쪽 컨테이너는
# 재생성되지 않는다. compose 가 이미지 태그가 그대로인 서비스를 건드리지 않기 때문이다.
#
# 엣지는 2단이다.
#   - 서버의 라우터 Caddy(~/infra): 80/443 소유, TLS 종료, 호스트명 분기
#   - 이 compose의 carix-caddy: Carix 애플리케이션 라우팅 (deploy/caddy/Caddyfile)
# 라우터가 참조하는 항목은 deploy/caddy/router.caddy 에 있다.
#
# spring-batch 는 없다. 배치 코드가 아직 없어서 spring-api 와 같은 이미지로 두 번째 웹 서버가
# 아무 일도 하지 않으며 JVM 힙만 차지했다. 메모리가 빠듯한 공유 호스트다.
# Spring Batch 도입 시 되살린다 — 그때 상주 스케줄러인지 원샷 잡인지도 함께 정한다.
services:
  carix-caddy:
    image: caddy:2-alpine
    container_name: carix_caddy
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    networks:
      - default
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend-node:
    image: ghcr.io/seohyeokgyu/carix/frontend:${FRONTEND_TAG:-latest}
    environment:
      - NODE_ENV=production
      - API_ORIGIN=http://spring-api:8080
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  spring-api:
    image: ghcr.io/seohyeokgyu/carix/backend:${BACKEND_TAG:-latest}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - CARIX_ENCRYPTION_KEY=${CARIX_ENCRYPTION_KEY}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50
    expose:
      - "8080"
    depends_on:
      - postgres
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CARIX_DEV_PASSWORD=${CARIX_DEV_PASSWORD}
    volumes:
      - carix-pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    # 루프백 전용 바인딩. 로컬 개발이 SSH 터널로 붙으려면 호스트에 포트가 있어야 하는데,
    # expose 만으로는 컨테이너 밖에 아무것도 없어 터널이 갈 곳이 없다.
    #
    # 127.0.0.1 을 반드시 명시한다. "5432:5432" 로 쓰면 0.0.0.0 에 붙어 인터넷에 노출된다.
    # Docker 가 발행한 포트는 firewalld 를 우회하므로(DOCKER 체인) 호스트 방화벽으로는 못 막는다.
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  carix-pgdata:
