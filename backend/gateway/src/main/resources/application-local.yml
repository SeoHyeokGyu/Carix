# 로컬 개발용. config·eureka 는 로컬에서 직접 기동한다(backend/README.md).
#
# register-with-eureka 를 반드시 false 로 둔다. 등록하면 서버 Gateway 가
# 이 노트북으로 운영 트래픽을 보낸다 (core-api/auth-service 의 동일 안전장치).
eureka:
  client:
    register-with-eureka: false
    fetch-registry: true

# 로컬 Eureka 는 localhost 주소를 그대로 알려주므로 이 오버라이드가 필수는 아니다.
# 다만 기동 순서 문제로 초기 디버깅엔 정적 URI가 편하다(spring-cloud-architecture.md §6).
# 필요할 때만 주석을 풀고 값을 채운다.
#
# spring:
#   cloud:
#     gateway:
#       routes:
#         - id: auth
#           uri: http://localhost:8081
#         - id: core
#           uri: http://localhost:8082
