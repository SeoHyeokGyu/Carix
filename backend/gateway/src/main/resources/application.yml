spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000
    gateway:
      # NOTE: spring-cloud-gateway-server-webflux 5.0.2(Spring Cloud 2025.1.2)부터
      # 라우트 프리픽스가 spring.cloud.gateway.routes 에서 spring.cloud.gateway.server.webflux.routes
      # 로 이동했다(GatewayProperties.PREFIX 확인). 이전 문서/예제의 routes 최상위 배치는 이 버전에서 동작하지 않는다.
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              order: -20
            - id: core
              uri: lb://core-api
              predicates:
                # core-api 실제 노출 경로 기준(HealthController, springdoc 기본값) — 도메인 API는
                # /v1/**, 헬스체크·문서는 /v1 없이 /api 바로 아래다.
                - Path=/api/v1/**,/api/health,/api/swagger-ui/**,/api/v3/api-docs/**
              filters:
                - SessionValidation
              order: -10
            - id: web
              uri: http://frontend-node:3000
              predicates:
                - Path=/**
              order: 0

server:
  port: 8080

eureka:
  client:
    # /actuator/refresh 때 Eureka 클라이언트를 다시 만들지 않는다. core-api/application.yml 과
    # 같은 이유 — 재생성된 DiscoveryClient 가 instanceId 를 null 로 들고 조회해 NPE 로 죽는다.
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,gateway
