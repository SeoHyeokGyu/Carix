spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  threads:
    virtual:
      enabled: true
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000
    gateway:
      # NOTE: spring-cloud-gateway-server-webflux 5.0.2(Spring Cloud 2025.1.2)부터
      # 라우트 프리픽스가 spring.cloud.gateway.routes 에서 spring.cloud.gateway.server.webflux.routes
      # 로 이동했다(GatewayProperties.PREFIX 확인). 이전 문서/예제의 routes 최상위 배치는 이 버전에서 동작하지 않는다.
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              order: -20
            # 헬스체크는 세션 검증을 받지 않는다. 배포 워크플로(.github/workflows/deploy.yml)가
            # 쿠키 없이 /api/health 를 호출해 200 을 요구하므로, SessionValidation 이 붙으면
            # 플래그를 켜는 순간 배포가 401 로 죽고 롤백 루프에 빠진다.
            #
            # order 를 명시하는 이유: 이 라우트가 없거나 order 가 web(Path=/**, order 0)과
            # 같으면 /api/health 가 frontend-node 로 흘러 SPA 셸을 200 으로 돌려준다.
            # 그러면 core-api 가 죽어 있어도 헬스체크가 통과한다.
            - id: core-health
              uri: lb://core-api
              predicates:
                - Path=/api/health
              order: -15
            - id: collector-admin
              uri: lb://collector
              predicates:
                - Path=/api/v1/admin/collector/**
              filters:
                - RewritePath=/api/v1/admin/collector/(?<segment>.*), /internal/pipeline/${segment}
              order: -12
            - id: core
              uri: lb://core-api
              predicates:
                # core-api 실제 노출 경로 기준(springdoc 기본값) — 도메인 API는 /v1/**,
                # 문서는 /v1 없이 /api 바로 아래다.
                #
                # swagger-ui·api-docs 는 여기 남긴다. 플래그를 켜면 문서도 세션을 요구하게 되는데,
                # 같은 출처 요청이라 로그인한 개발자의 브라우저는 쿠키를 실어 보내므로 그대로 열린다.
                - Path=/api/v1/**,/api/swagger-ui/**,/api/v3/api-docs/**
              filters:
                - SessionValidation
              order: -10
            - id: web
              uri: http://frontend-node:3000
              predicates:
                - Path=/**
              order: 0

server:
  port: 8080

eureka:
  client:
    # /actuator/refresh 때 Eureka 클라이언트를 다시 만들지 않는다. core-api/application.yml 과
    # 같은 이유 — 재생성된 DiscoveryClient 가 instanceId 를 null 로 들고 조회해 NPE 로 죽는다.
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,gateway
