dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// BCryptPasswordEncoder 만 쓴다. 필터 체인·UserDetailsService 는 두지 않는다 —
	// 인증은 세션이 이미 하고 있다.
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Boot 4 는 자동설정을 기술별 모듈로 쪼갰다. flyway-core 만 선언하면 클래스패스에는 있지만
	// 구동할 자동설정이 없어 마이그레이션을 조용히 건너뛴다 — starter 가 spring-boot-flyway 를 끌어온다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
	// core-api/build.gradle 와 동일한 이유: spring.config.import 는 prepareEnvironment
	// 단계에서 해석돼 @TestPropertySource 로 덮을 수 없다.
	systemProperty 'spring.cloud.config.enabled', 'false'
	systemProperty 'eureka.client.enabled', 'false'
}
