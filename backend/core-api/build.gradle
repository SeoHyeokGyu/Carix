dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	// spring.config.import 는 prepareEnvironment 단계에서 해석돼 @TestPropertySource 로
	// 덮을 수 없다. 시스템 프로퍼티는 그 단계에서 읽히므로 여기서 optional 로 바꾼다.
	// 운영 application.yml 은 fail-fast 를 유지한다 — 설정 없이 기본값으로 뜨면
	// 잘못된 임계값으로 계산해 조용히 틀린 결과를 낸다.
	systemProperty 'spring.cloud.config.enabled', 'false'
	systemProperty 'eureka.client.enabled', 'false'

	// [독립적인 테스트 환경 설정]
	// 외부 PostgreSQL DB 구동 없이도 @SpringBootTest, @DataJpaTest 등의 통합/슬라이스 테스트가
	// 격리된 인메모리 환경에서 독립적으로 실행될 수 있도록 H2 DB 속성을 시스템 프로퍼티로 주입한다.
	// - MODE=PostgreSQL: PostgreSQL 방언 및 데이터 타입(UUID, ILIKE 등) 호환성 보장
	// - DATABASE_TO_LOWER=TRUE: 대소문자 무시 식별자 처리
	// - INIT=CREATE SCHEMA IF NOT EXISTS core: 엔티티들이 @Table(schema = "core")로 지정되어 있으므로
	//   인메모리 DB 초기화 시 core 스키마를 먼저 생성해야 DDL 생성이 실패하지 않는다.
	systemProperty 'spring.datasource.url', 'jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS core'
	systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
	systemProperty 'spring.jpa.database-platform', 'org.hibernate.dialect.H2Dialect'
	// 테스트 실행 시점에 엔티티 매핑을 기반으로 테이블을 자동 생성하고 테스트 종료 후 정리한다.
	systemProperty 'spring.jpa.hibernate.ddl-auto', 'create-drop'

	// [테스트용 AES 암호화 키]
	// EncryptedConverter 가 민감 컬럼 암/복호화에 사용하는 256비트(32바이트) Base64 키를 주입한다.
	systemProperty 'carix.encryption-key', 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
}
