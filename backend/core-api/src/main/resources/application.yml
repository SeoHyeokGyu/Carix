spring:
  application:
    # Config Server 가 이 이름으로 config/spring/core-api.yml 을 찾는다.
    name: core-api
  config:
    # optional: 은 "위치를 해석할 수 없으면 건너뛴다" 는 뜻이다. 연결 실패와는 다르다 —
    # 연결 실패는 아래 fail-fast 가 잡는다. 운영에서 설정 없이 기본값으로 뜨면
    # 잘못된 임계값으로 계산해 조용히 틀린 결과를 낸다.
    #
    # 테스트는 spring.cloud.config.enabled=false 로 클라이언트를 꺼서 이 위치를
    # 해석 불가로 만들고, optional: 이 그것을 건너뛰게 한다 (core-api/build.gradle 참조).
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  threads:
    virtual:
      enabled: true
  datasource:
    # 접속 정보는 SPRING_DATASOURCE_* 로 주입된다.
    # 산출기 팬아웃 조회가 메인 트랜잭션의 커넥션 풀을 고갈시키지 않도록
    # 쓰기 풀(CarixWritePool)과 읽기 전용 풀(CarixReadOnlyPool)을 분리했다 (b17).
    #   - 쓰기 풀: 트랜잭션 쓰기 및 pg_advisory_xact_lock 점유
    #   - 읽기 풀: MVI/OWI 가상 스레드 팬아웃 및 읽기 전용 조회 (@Transactional(readOnly = true))
    write:
      hikari:
        pool-name: CarixWritePool
        maximum-pool-size: 15
        minimum-idle: 3
    readonly:
      hikari:
        pool-name: CarixReadOnlyPool
        read-only: true
        maximum-pool-size: 25
        minimum-idle: 5
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000

# 엣지 Caddy 가 /api/* 를 경로 그대로 넘긴다. 컨텍스트 패스를 /api 로 두면
# 헬스체크·OpenAPI 문서·Swagger UI 정적 자원이 전부 /api 아래로 들어온다.
server:
  servlet:
    context-path: /api
  forward-headers-strategy: framework
  port: 8082

eureka:
  client:
    # /actuator/refresh 때 Eureka 클라이언트를 다시 만들지 않는다.
    #
    # 기본값(true)이면 eurekaClient 가 @RefreshScope 라 refresh 마다 재생성되는데,
    # 새 DiscoveryClient 가 자기 instanceId 를 null 로 들고 레지스트리를 조회해
    # NullPointerException: Cannot invoke "Object.hashCode()" because "key" is null
    # 로 죽는다 (spring-cloud-netflix-eureka-client 5.0.2, 2026-07-30 실측).
    #
    # 애초에 갱신하려는 것은 지수 임계값 같은 도메인 설정이지 레지스트리 접속 정보가 아니다.
    # 재생성되면 refresh 마다 등록이 한 번씩 끊겼다 붙는다.
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    # 컨테이너 호스트명 대신 서비스명으로 등록해 Gateway 가 찾기 쉽게 한다.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

carix:
  scenario:
    unemployment:
      # 도메인 정의서 §4.1 의 가정치다. 법정 공시값이 아니므로 고용보험 공시 기준이 바뀌면
      # 여기와 assumption-as-of 를 함께 갱신한다. 응답의 unemploymentBenefitNote 가
      # 이 시점을 화면에 그대로 실어 `가정 기반 추정` 임을 알린다.
      # Config Server 의 core-api.yml 이 덮어쓸 수 있다.
      daily-upper-limit: 66000
      daily-lower-limit: 60120
      assumption-as-of: "2026-01"
