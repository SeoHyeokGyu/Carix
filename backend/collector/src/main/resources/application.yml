spring:
  application:
    # Config Server 가 이 이름으로 config/spring/collector.yml 을 찾는다.
    # 아직 그 파일은 없다 — native 백엔드는 없는 애플리케이션 이름에 빈 설정을
    # 돌려주므로 기동은 정상이다. 크롤링 파라미터가 생길 때 함께 만든다.
    name: collector
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: core

server:
  # Gateway 라우트(/api/v1/admin/collector/** -> /internal/pipeline/**)를 통해 관리자 요청을 수신합니다.
  port: 8083

carix:
  collector:
    admin-key: ${CARIX_ADMIN_KEY:carix-admin-secret-dev-key}

eureka:
  client:
    # /actuator/refresh 때 Eureka 클라이언트를 다시 만들지 않는다. core-api/application.yml
    # 과 같은 이유 — 재생성된 DiscoveryClient 가 instanceId 를 null 로 들고 조회해 NPE 로 죽는다.
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
