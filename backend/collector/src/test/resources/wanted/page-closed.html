<html><body><script id="__NEXT_DATA__" type="application/json" crossorigin="anonymous">{"props":{"pageProps":{"initialData":{"id":315000,"address":{"country_code":"KR","country":"한국","location":"서울","district":"마포구","full_location":"서울 마포구 와우산로29가길 42, 사옥건물"},"company":{"company_id":54693,"company_name":"리샵","company_description":"우리는 일상 속에서 자연스럽게 선택되는 제품을 만들기 위해 \n디자인과 편안함의 균형을 끊임없이 연구해왔습니다.\n\nSAINT SATIN은 샌달 제품을 시작으로\n다양한 카테고리로 확장하며 빠르게 성장해왔습니다.\n메리제인, 스니커즈, 기능성 슬리퍼, 부츠 등\n라이프 스타일 전반을 아우르는 제품 라인업을 구축하고 있습니다.\n\n특히 소재 개발, 인솔 구조 설계, 금형 개발 등\n제품의 본질적인 경쟁력을 강화하기 위한 연구를 지속하고 있으며,\n디자인과 기능이 자연스럽게 공존하는 제품을 만들어가고 있습니다.\n\nSAINT SATIN은 고객의 일상에 더 높은 만족을 제공하는 브랜드로,\n그리고 제품을 넘어 경험을 설계하는 브랜드로 성장하고 있습니다.\n\nSAINT SATIN의 이야기, 지금 시작됩니다.","industry_name":"판매, 유통","title_images":["https://static.wanted.co.kr/images/company/54693/uuugu74gznghj7nk__1080_790.png","https://static.wanted.co.kr/images/company/54693/gfeu7c7lukq0swna__1080_790.png","https://static.wanted.co.kr/images/company/54693/pfmqzqnlgrtfjjbq__1080_790.png","https://static.wanted.co.kr/images/company/54693/xvsq1yymgfv1ujki__1080_790.png","https://static.wanted.co.kr/images/company/54693/spiikhtdb8kchkbf__1080_790.png","https://static.wanted.co.kr/images/company/54693/a2rgfb68mogya6pa__1080_790.png","https://static.wanted.co.kr/images/company/54693/xkrbvix3jbneaiqu__1080_790.png","https://static.wanted.co.kr/images/company/54693/2xxgqlzy19tka3me__1080_790.png","https://static.wanted.co.kr/images/company/54693/uyesn47nlefypdvn__1080_790.png","https://static.wanted.co.kr/images/company/54693/8turze9fdijghnn1__1080_790.png","https://static.wanted.co.kr/images/company/54693/dhxxsfrc7dslcgjp__1080_790.png"],"logo_image":"https://static.wanted.co.kr/images/wdes/0_5.f0f899cc.jpg","company_status":"COMPLETION","registration_number":"7803500447"},"confirm_time":"2025-11-17","due_time":null,"intro":"2018년도 설립된 회사로 세인트새틴(SAINT SATIN) 브랜드 사업을 하고 있는 패션전문브랜드 회사입니다.\n\n일상과 아트의 접점을 완벽하게 조정하고 디자인하는 SAINT SATIN은\n트렌드가 돋보이는 디자인은 물론 다양한 믹스매치가 가능한 아이템을 선보이며\n지속가능성과 변하지 않는 가치를 추구하고 항상 새로운 스타일을 시도하는 브랜드입니다.\n\n글로벌 무역 및 해외 공장을 바탕으로 독보적인 유통 구조를 갖추고 있으며, 마케팅과 자금력으로 안정적인 재무 구조를 자랑합니다.\n또한 실무 능력이 갖춰진 임원진의 리딩으로 인재풀이 탄탄합니다. \n\n서울 사옥(본사)을 중심으로 인천 지사, 중국 지사가 있으며 각 부서별 협력사(광고 에이전시)가 존재합니다.\n빠른 성장세로 글로벌 브랜드 도전 중이며, 추후 명품 라이센스 구매 및 2차 브랜드 창출 등 준비 중입니다.","preferred_points":"• 메타 광고관리 전문가\n• MS Office (Excel, Word, PPT) 활용능력이 뛰어나신 분\n• 마케팅 자동화 툴 및 데이터 분석 툴 사용 경험 및 활용능력이 뛰어나신 분\n  (GA, 앱스플라이어, Tableau 등)\n• 조직관리 및 리딩 역량이 뛰어난 분\n• 앱 / 웹 디지털 마케팅 관련 경험, 자격증 있으신 분\n• 변화에 빠르게 적응하며, 주도적인 실행력이 있으신 분\n• 경력 포트폴리오 제출 (본인 기여도 작성)","benefits":"• 자유로운 연차, 반차, 반반차 (2시간 단위) 사용\n• 생일축하 반차 제공\n• 각종 경조사 휴가(유급) 제공\n• 명절 선물 증정\n• 입사 축하 선물 증정\n• 출산, 결혼, 육아휴직 등 각종 휴가제도\n• 자사 전 제품 직원할인 40%\n• 장기근속자 포상 휴가. 보너스 지급 / 연차별 지급\n• 우수사원 포상\n• 출장비 (지방,해외) 지원\n• 워라밸 보장 (야근 X, 회식 X)\n• 업무효율화를 위한 AI사용지원 (Chat GPT 사용가능)\n• 라면바 무한제공 (한강라면 기기)\n• 커피바 무상제공 (카페용 최고급 커피머신 / 월 10~20만원 상당)\n• 각종음료 무상제공","main_tasks":"1. 마케팅 전략 수립 및 운영\n - 마케팅 포지셔닝 전략 및 연간 / 분기별 마케팅 로드맵 수립\n - 마케팅 KPI (매출액, CTR, ROAS 등) 정의 및 성과분석\n\n2. 캠페인 기획 및 실행\n - 마케팅 활동에 필요한 전반적인 프로젝트 관리\n - 매체별 광고 집행 데이터 기반으로 인사이트 도출 및 리포트\n - 온드미디어 기획 및 관리\n\n3. 리딩 및 커뮤니케이션\n - 마케팅팀 팀원관리 및 육성\n - 마케팅 홍보 대행사 관리 및 커뮤니케이션 담당\n\n4. 보고 및 성과관리\n - 온라인 매출 및 성과관리\n - 광고 성과관리 및 효율분석\n - 데이터 관리 및 보고\n\n5. 인사이트 도출\n - 데이터 분석을 통한 트랜드 및 경쟁사 분석 리포트\n - 정량적 / 정성적 리서치 기반의 브랜드 개선방향 제시","position":"마케팅 리더(팀장)","requirements":"• 브랜드 마케팅팀 리더 및 광고대행사 파트장급 이상 경력자\n• IMC 캠페인, 콘텐츠 마케팅, 브랜드 전략 등 기획 및 실행 경험 있으신 분\n• 데이터 분석에 기반하여 브랜드 마케팅 기획으로 성과를 창출해보신 분\n• 퍼포먼스 / 브랜드 마케팅 등 디지털 마케팅에 대한 높은 이해도 및 실무능력을 갖추신 분\n• 다양한 이해관계자 (내부 / 외부)와의 원활한 커뮤니케이션 및 협업 역량이 있으신 분","hire_rounds":"• 서류 ＞ 1차면접 ＞ (2차) ＞ 최종합격\n• 면접일정은 추후 통보됩니다.\n• 허위사실 발견 시 채용 취소됩니다.\n• 경력 포트폴리오 제출 (본인 기여도 작성)","status":"close","category_tag":{"parent_tag":{"id":523,"text":"마케팅·광고"},"child_tags":[{"id":707,"text":"브랜드 마케터"},{"id":710,"text":"마케터"},{"id":719,"text":"마케팅 전략 기획자"}]},"career":{"annual_from":3,"annual_to":100,"is_newbie":false,"is_expert":true},"is_remote_work"
