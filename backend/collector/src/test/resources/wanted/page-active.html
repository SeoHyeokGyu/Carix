<html><body><script id="__NEXT_DATA__" type="application/json" crossorigin="anonymous">{"props":{"pageProps":{"initialData":{"id":391003,"address":{"country_code":"KR","country":"한국","location":"서울","district":"영등포구","full_location":"서울 영등포구 여의대방로69길 23, 10층 (07333)"},"company":{"company_id":26889,"company_name":"콕스웨이브","company_description":"\"Shaping safe, reliable, and hyper-personalized AI experiences\" \n\n2021년에 설립된 콕스웨이브는 생성형 AI B2C 제품을 운영하며 8개월 만에 130만명 이상의 사용자를 확보하였습니다. 국내 최초 생성형 AI 분야의 매각 사례로 운영 중인 B2C 제품을 국내 상장사에 매각 후 현재 얼라인 (Align) 제품을 만들고 있습니다. \n\n[Align이란?]\n얼라인은 LLM 기반 대화형 제품에 특화된 제품 및 사용자 분석 도구입니다 (ChatGPT나 Claude 같은 제품을 위한 Google Analytics).\n얼라인을 통해 제품 기획자 (Product Manager 등)는 사용자가 본인 제품과 어떻게 상호작용하고 있는지, 어떤 점에서 제품 경험 개선이 필요한지 등, 제품 운영에 필수인 인사이트를 빠르게 파악할 수 있습니다. \n\n[Align의 성장은?]\n그동안 얼라인은 아래와 같이 빠르게 실천해 나아가고 있습니다:\n• 23년 10월 SaaS 솔루션 출시 후 Product of the Day (Product Hunt) 3위 달성\n• SOC 2, GDPR 등 데이터 보안 인증 취득\n• 24년 1월, 45억원 규모 시드 투자 유치 (KB 인베스트먼트 등)\n• 신규 Enterprise 솔루션 출시\n• 미국 및 인도 지사 설립\n• 글로벌 기업들과 협업 (메타, 마이크로소프트, NVIDIA, AWS, PwC 등)\n• 국내 최초 PwC India와 파트어십 구축\n• Claude 개발사 Anthropic과 파트너십 및 아시아 최초 AI Builder Summit 공동 주최\n\n저희와 함께 생성형 AI의 미래를 주도하실 팀원 분들을 모시고자 합니다!","industry_name":"IT, 컨텐츠","title_images":["https://static.wanted.co.kr/images/company/26889/75apv9oo0lqfc0bn__1080_790.jpg","https://static.wanted.co.kr/images/company/26889/yfq1e0jkzwvv1yg7__1080_790.png","https://static.wanted.co.kr/images/company/26889/xmmx7ojgmgatzwqz__1080_790.jpeg","https://static.wanted.co.kr/images/company/26889/kquhcadvknizyskc__1080_790.jpeg","https://static.wanted.co.kr/images/company/26889/jocmz8ilgky6hr9l__1080_790.jpg"],"logo_image":"https://static.wanted.co.kr/images/wdes/0_4.20b81430.png","company_status":"COMPLETION","registration_number":"6388602035"},"confirm_time":"2026-10-07","due_time":null,"intro":"[AX Team, krewa]\n• krewa는 기업이 AI에게 중요한 업무를 위임할 수 있는 운영 기반을 만들어요.\n• AI 모델은 이미 문서를 읽고, 판단하고, 도구를 사용할 만큼 강력해졌어요. 하지만 기업 현장에서는 여전히 사람이 결과를 전부 다시 확인해요. 80%가 맞아도 어느 20%가 틀렸는지 모르면 결국 100%를 검토해야 하니까요. AI가 아직 '초안 도우미'에 머물러 있고 이 상태로는 중요한 업무를 AI에게 맡길 수 없어요.\n• krewa는 이걸 모델 성능이 아니라 실행 구조로 풀고 있어요. AI Worker가 업무를 수행하고, Trust System이 실행 전 과정을 검증해요. 위험이 감지되면 실행을 멈추고 사람의 판단을 받은 뒤 다시 이어가요. 그 판단은 다음 실행을 더 정확하고 안전하게 만드는 데 활용돼요.\n• 이를 통해 사람의 판단이 필요해 자동화하기 어려웠던 반복 업무까지 AI에게 위임할 수 있게 해요. 직원은 반복적인 처리와 검토에서 벗어나, 자신의 전문성이 더 필요한 일에 집중할 수 있어요.\n• AI가 업무를 돕는 시대에서, 업무를 맡는 시대로. krewa는 AI가 기업 운영의 한 축이 되는 미래를 만들고 있어요.\n\n[krewa 를 만들어온 여정]\n• AI를 평가하는 데서, 실행을 통제하는 데까지\n-- AI가 내린 판단과 업무 수행 과정을 검증하는 일은 콕스웨이브가 2021년부터 풀어온 문제예요.\n-- AI Agent 성능 평가 솔루션을 운영하며 300개 이상의 글로벌 고객사에 품질 평가와 분석 기능을 제공했어요.\n-- 금융 고객사의 실제 업무 데이터를 월 수십만 건 규모로 분석하고 평가하고 있어요.\n-- 독자 파운데이션 모델의 지시 이행 성능을 평가하는 기준을 만들고, 평가 데이터의 품질을 검증했어요.\n-- 2025년부터 AI의 이상 행동을 탐지하는 기술을 개발하고 있어요.\n-- AI 실행 통제 관련 국가 표준화 작업에 참여하고 있어요.\n-- 행정안전부, 국가인공지능위원회 등 여러 기관에 AI Agent 통제 기술을 자문했어요.\n\n• 연구를 넘어, 제품과 시장에서 증명해 왔어요\n-- 우리는 기술을 연구하는 데서 멈추지 않고, 실제 제품과 고객의 성과로 연결해 왔어요.\n-- 국내 최초의 생성형 AI 서비스 매각 사례를 만들었어요.\n-- 2023년부터 Microsoft의 Agent Orchestration 오픈소스 프로젝트에 코어 컨트리뷰터로 참여하고 있어요.\n-- Meta, PwC 등 글로벌 기업의 AX 프로젝트를 수행하고, 현대차를 비롯한 여러 기업에 AI Agent 연구와 개발을 자문했어요.\n-- NVIDIA, Anthropic, OpenAI 등 글로벌 기술 기업과 협업하고 파트너십을 구축했어요.\n-- Anthropic, OpenAI와 서밋과 해커톤을 공동 개최하며 국내 AI 생태계의 성장을 함께 만들어 왔어요.\n\n[지금 krewa 팀에 합류한다는 것]\n• krewa는 아이디어만 있는 단계도, 답이 모두 정해진 단계도 아니에요. 고객사와 실제 Agent 를 만들며 반복적으로 나타나는 문제를 발견하고, 그 해법을 표준 Krewa와 Trust System의 공통 기능으로 발전시키는 단계에 있어요.\n• Agent는 여러 단계에 걸쳐 판단하고 도구를 사용하기 때문에 최종 결과만 확인해서는 어디서 왜 실패했는지 알기 어려워요. 형식이나 정책을 위반할 수 있고, 근거 없이 판단하거나 잘못된 도구를 호출할 수도 있어요. 개별 판단은 맞더라도 전체 실행 흐름이 의도와 다르게 진행될 수도 있어요.\n• 우리는 이런 실패를 사후에 평가하는 데서 멈추지 않으려고 해요. Agent의 실행을 관찰하고, 위험을 탐지하고, 원인을 추적하고, 필요한 경우 실행을 중단하거나 사람의 판단을 요청할 수 있는 Trust System을 만들고 있어요.\n• Trust System은 특정 Agent Framework에 종속되지 않는 독립적인 시스템을 지향해요. krewa뿐 아니라 다른 Agent Workflow에도 연결할 수 있도록 공통 실행 정보와 판단 인터페이스를 설계해야 해요. 동시에 고객 현장의 구체적인 실패를 실제로 해결하면서, 어떤 기술이 제품에서 유효한지 증명해야 해요.\n\n[이런 분과 함께하고 싶어요]\n• 사람과 조직을 관리하는 데 집중하는 역할이 아니에요. 직접 논문을 읽고 연구 가설을 세우며, 실험 코드와 제품의 핵심 기능을 구현해요. 동시에 연구자와 엔지니어가 같은 문제와 기준을 보고 움직일 수 있도록 기술 방향을 제시하고 중요한 의사결정을 이끌어요.\n• 고객 환경에서 발견한 Agent의 실제 실패를 일반화 가능한 연구 문제로 정의하고, 재현 가능한 benchmark와 탐지·통제 기술로 발전시켜요. 검증된 결과는 Trust System와 Krewa에 적용하고 독창적인 성과는 탑티어 학회 논문과 특허로 남겨요.\n• 엔지니어들과 함께 연구와 제품 개발의 경계를 오가며 아이디어가 논문이나 PoC에 머물지 않고 실제 고객 환경에서 작동하도록 만들어요.\n\n[합류 후 기대하는 역할]\n• 고객사의 실제 Agent 기반 업무 수행에서 반복적으로 발생하는 실패 유형을 정의하고, Trust System의 기술 로드맵과 우선순위를 수립해요.\n• Agent의 실행 정보를 수집하고 위험을 탐지하며, 필요한 경우 실행을 중단하거나 사람의 승인을 요청할 수 있는 Trust System을 고도화해요.\n• 실제 제품 문제에서 연구 의제를 발굴하고, 재현 가능한 실험과 benchmark를 구축하여 탑티어 학회 투고로 연결해요.\n• 연구자와 엔지니어의 실험 및 설계를 리뷰하고, 연구 결과를 안정적인 프로덕션 시스템으로 연결하는 기술 기준을 만들어요.","preferred_points":"• Agent 평가, reliability, safety, observability, runtime control을 연구하거나 제품에 적용해 본 경험이 있어요.\n• 복잡한 Agent Workflow 또는 Multi-Agent System을 프로덕션 환경에서 운영해 본 경험이 있어요.\n• NeurIPS, ICML, ICLR, ACL, EMNLP 등 주요 학회에 주저자 또는 핵심 기여자로 논문을 투고하거나 게재한 경험이 있어요.\n• 대규모 비정형 문서를 OCR, layout detection, table extraction, multimodal model 등을 활용해 구조화하고 품질을 평가해 본 경험이 있어요.\n• Agent Memory의 검색, 충돌 해소, 버전 관리, provenance 및 lifecycle을 설계하거나 운영해 본 경험이 있어요.\n• 평가 결과와 사용자 피드백을 prompt, retrieval, memory 또는 workflow 개선으로 연결하는 자동화된 loop를 구축해 본 경험이 있어요.\n• 고객사 프로젝트에서 발견한 문제와 해법을 여러 고객과 업무에 적용할 수 있는 공통 제품 기능으로 일반화해 본 경험이 있어요.\n• 자신의 기술적 성과를 특허로 출원하거나 등록해 본 경험이 있어요.\n• 컴퓨터공학, 인공지능 또는 관련 분야의 석·박사 학위를 보유했거나 그에 준하는 연구·개발 경험이 있어요.","benefits":"• 자율 출근제(오전 8시~11시) 및 재택 근무(주1회) 제도 운영\n• 최신 업무 장비 제공\n• 근로계약 외 별도 식대 소정 제공\n• 간식 및 음료 제공\n• 월간 팀 회식비 지원\n• 경조사 지원 및 근속 연차별 포상 제도 운영\n• Claude 등 AI 도구 구독 지원\n• 업무 관련 도서 지원\n• 업무 유관 컨퍼런스 참가비 지원","main_tasks":"• Trust System 기술 전략 및 아키텍처\n-- Agent의 어떤 실패를 우선 다룰지, 어떤 실행 정보와 신호로 판단할지, 언제 Trust System이 개입할지를 정의해요.\n-- krewa와 외부 Agent 서비스에 연결할 수 있는 공통 trace, event schema, 판단 API 및 제어 지점을 설계해요.\n-- 탐지 정확도뿐 아니라 오탐과 미탐, 응답 지연, 비용, 설명 가능성, 운영 안정성 사이의 기준과 trade-off를 결정해요.\n\n• Agent 오류 탐지 및 실행 통제\n-- 규칙과 정책 기반 검증, LLM 기반 평가, ML 기반 이상 탐지 등을 조합하여 Agent의 오류와 의도하지 않은 행동을 탐지해요.\n-- 환각, 추론 오류, 정책 위반, 잘못된 도구 호출, 일관성 오류 등 주요 실패의 원인을 실행 단계별로 추적해요.\n-- 위험 수준과 근거에 따라 실행 허용, 중단, 재시도, 대체 경로 또는 Human-in-the-loop로 연결되는 제어 방식을 구현해요.\n\n• 평가 체계 및 개선 루프\n-- Agent의 실패를 일관되게 분류할 수 있는 failure taxonomy와 benchmark 데이터셋을 구축해요.\n-- Grader, human evaluation 및 자동화된 평가 파이프라인을 설계하고 평가 결과의 신뢰도와 재현성을 검증해요.\n-- 실행 결과와 사람의 피드백을 prompt, retrieval, memory, workflow와 Trust System 개선으로 반복하는 체계를 만들어요.\n\n• Research-to-Production\n-- 연구 아이디어를 빠르게 구현하고 실험하여 실제 제품 문제에 유효한지 검증해요.\n-- 연구자 및 엔지니어와 함께 실험 코드를 테스트 가능하고 관찰 가능한 프로덕션 시스템으로 발전시켜요.\n-- 고객사별 구현에서 공통 원리와 재사용 가능한 기능을 찾아 표준 Krewa와 Trust System의 제품 자산으로 만들어요.\n\n• 논문 및 지식재산화\n-- Agent Reliability, failure attribution, online auditing, anomaly detection, runtime control 등 제품과 연결되는 연구 문제를 발굴하고 연구 계획을 수립해요.\n-- 실험 설계와 분석, 논문 작성 및 투고를 주도하여 NeurIPS, ICML, ICLR, ACL, EMNLP 등 주요 학회 수준의 연구 성과를 만들어요.\n-- 업무 과정에서 발견한 독창적인 기술을 특허와 기술 보고서 등으로 남겨 팀의 장기적인 기술 자산으로 발전시켜요.\n\n• Hands-on 기술 리더십\n-- 중요한 연구 및 시스템 설계에 직접 참여하고 핵심 기능을 구현해요.\n-- 연구자와 엔지니어의 실험 설계, 코드 및 아키텍처를 리뷰하고 기술적 의사결정을 이끌어요.\n-- 불확실한 문제를 구체적인 가설과 실행 계획으로 전환하고, 결과와 근거를 바탕으로 다음 우선순위를 정해요.","position":"[AX krewa] 리서치 엔지니어 (Lead)","requirements":"• LLM 또는 Agent 시스템의 연구와 프로덕션 개발을 수행하고 중요한 기술적 의사결정을 주도해 본 경험이 있어요.\n• 모호한 제품 문제를 연구 가설, 실험 설계, 평가 지표와 구현 가능한 시스템으로 구체화해 본 경험이 있어요.\n• LLM Workflow를 직접 설계하고 실제 환경에서 운영하며 실패를 분석·개선해 본 경험이 있어요.\n• AI 시스템의 평가 체계를 설계하고 검증해 본 경험이 있어요.\n• Python과 ML Framework를 활용하여 연구용 prototype과 프로덕션 코드를 모두 작성할 수 있어요.\n• 성능, 안정성, 비용과 개발 속도 사이의 trade-off를 판단하고 시스템 설계에 반영할 수 있어요.\n• 여러 연구자와 엔지니어의 기술적 판단에 영향을 주고, 공통 방향과 기준을 만들어 본 경험이 있어요.\n• 새로운 연구 문제를 정의하고 재현 가능한 실험을 설계하여 논문 수준의 결과물로 완결해 본 경험이 있어요.\n• 복잡한 기술적 판단과 연구 결과를 논문, 설계 문서 및 기술 문서로 명확하게 설명할 수 있어요.","hire_rounds":"• 서류 심사\n• 사전 과제\n• 1차 인터뷰: 직무 인터뷰 \n• 2차 인터뷰: 컬처핏 인터뷰\n• 3차 인터뷰: 대표 인터뷰\n• 레퍼런스 체크\n• 처우 협의\n• 최종 합격","status":"active","category_tag":{"parent_tag":{"id":518,"text":"개발"},"child_tags":[{"id":1634,"text":"머신러닝 엔지니어"}]},"career":{"annual_from":3,"annual_to":35,"is_newbie":false,"is_expert":true},"is_remote_work":false,"close_time":null,"hidden":false,"is_priva
