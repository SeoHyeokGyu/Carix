dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// Crawler dependencies
	implementation 'org.jsoup:jsoup:1.18.1'
	implementation 'org.apache.commons:commons-csv:1.11.0'

	// Flyway 는 쓰지 않는다. core 스키마는 DDL 을 직접 적용해 관리한다
	// (근거와 절차는 docs/DEVELOPMENT.md).
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
	// core-api/build.gradle 에서 그대로 가져온다. spring.config.import 는
	// prepareEnvironment 단계에서 해석돼 @TestPropertySource 로 덮을 수 없다.
	systemProperty 'spring.cloud.config.enabled', 'false'
	systemProperty 'eureka.client.enabled', 'false'

	// 컨텍스트를 띄우는 테스트가 DB 없이도 돌게 한다. JPA 자동설정이 DataSource 를
	// 요구하므로 연결은 잡지 않고(초기화 실패 무시) 방언만 고정해 EntityManagerFactory 를
	// 만든다. DB 를 실제로 건드리는 테스트가 생기면 여기서 연결 거부로 드러난다.
	systemProperty 'spring.datasource.url', 'jdbc:postgresql://127.0.0.1:1/unused'
	systemProperty 'spring.datasource.hikari.initialization-fail-timeout', '-1'
	systemProperty 'spring.jpa.database-platform', 'org.hibernate.dialect.PostgreSQLDialect'
	systemProperty 'spring.jpa.hibernate.ddl-auto', 'none'
}
