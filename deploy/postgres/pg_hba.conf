# Carix Postgres client authentication — git 관리.
#
# postgres 서비스 command 의 `-c hba_file=...` 로 이 파일을 직접 가리킨다(compose 참조).
# 데이터 볼륨 안의 기본 pg_hba.conf 는 더 이상 쓰이지 않는다 — 이 파일이 유일한 정본이다.
#
# 설계: 컨테이너 내부망(도커 브리지, 172.16.0.0/12)은 평문 허용 — 호스트 밖으로 안 나간다.
# 그 외(=인터넷 경유 외부 접속)는 hostssl 로 TLS 를 강제한다. 매칭 안 되는 평문 외부 접속은
# 이 파일 어디에도 안 걸려 자동 거부된다(hostssl 는 SSL 접속만 매칭하므로).
#
# TYPE     DATABASE  USER  ADDRESS            METHOD
local      all       all                      trust
host       all       all   127.0.0.1/32       trust
host       all       all   ::1/128            trust
local      replication all                    trust
host       replication all 127.0.0.1/32       trust
host       replication all ::1/128            trust

# 도커 브리지 내부망 — core-api/auth-service ↔ postgres, 평문 허용
host       all       all   172.16.0.0/12      scram-sha-256

# 그 외 전부(외부 인터넷 경유) — TLS 필수
hostssl    all       all   0.0.0.0/0          scram-sha-256
hostssl    all       all   ::/0                scram-sha-256
