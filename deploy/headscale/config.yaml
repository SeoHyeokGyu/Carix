# Headscale — 자체 호스팅 Tailscale 컨트롤 서버.
#
# 팀원 노트북과 이 서버를 같은 사설망에 넣어 운영 DB(`carix`)에 접근시킨다.
# 클라이언트는 Tailscale 공식 클라이언트를 그대로 쓴다 (근거는 docs/DEVELOPMENT.md §3.2).
#
# TLS는 여기서 처리하지 않는다. 라우터 Caddy(`infra_caddy`)가 종료하고
# `deploy/caddy/router.caddy`의 항목이 이 컨테이너로 넘긴다.

# 클라이언트가 접속할 주소. 라우터가 TLS를 붙이므로 https 로 광고한다.
server_url: https://headscale.144.24.90.88.sslip.io

# 컨테이너 안에서 듣는 주소. edge 네트워크의 Caddy 가 닿아야 하므로 0.0.0.0 이다.
# 호스트 포트로는 발행하지 않는다 — 외부 경로는 라우터 하나뿐이다.
listen_addr: 0.0.0.0:8080

# metrics·gRPC 는 노출하지 않는다. CLI 는 컨테이너 안에서 unix socket 으로 쓴다.
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# 라우터 Caddy 가 붙여 보내는 X-Forwarded-For 를 신뢰한다. Docker 브리지는 사설 대역이다.
trusted_proxies:
  - 172.16.0.0/12

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  # 내장 DERP 는 쓰지 않는다. Tailscale 공개 DERP 를 그대로 쓴다 —
  # 계정 없이 이용 가능하고, 이 호스트에 STUN 포트를 더 열지 않아도 된다.
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: false

# 노드 키 기본 만료. Tailscale SaaS 는 180d 를 쓴다. 0 이면 만료 없음.
node:
  expiry: 180d

database:
  type: sqlite
  sqlite:
    # 이 파일이 노드 키와 ACL 을 갖는다. 잃으면 팀원 전원이 재인증해야 한다.
    # headscale-data 볼륨에 있으며 백업 대상이다.
    path: /var/lib/headscale/db.sqlite

# TLS 는 라우터가 처리하므로 여기서는 비운다.
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  # tailnet 내부 DNS 접미사. 서버는 <노드이름>.carix.internal 로 불린다.
  base_domain: carix.internal
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
  search_domains: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
