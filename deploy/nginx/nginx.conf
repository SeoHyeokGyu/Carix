# Carix reverse proxy — 동일 출처에서 화면과 API 제공, CORS 최소화.
server {
    listen 80;
    server_name _;

    # TLS 종료는 배포 시 인증서와 함께 443 서버 블록으로 확장한다.

    # API → Spring Boot
    location /api/ {
        proxy_pass http://spring-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 assets → 프런트엔드 컨테이너가 빌드 산출물 제공
    location /assets/ {
        proxy_pass http://frontend-node:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 그 외 전부 → Node SSR
    location / {
        proxy_pass http://frontend-node:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
