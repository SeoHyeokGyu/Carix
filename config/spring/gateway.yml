# gateway 전용 설정. 시크릿은 여기 두지 않는다.
carix:
  gateway:
    session-validation:
      # 켜는 순간 세션 쿠키 없는 core 라우트 호출은 전부 401 이 된다. 팀 조율 후 켠다.
      #
      # 선행 조건은 이제 전부 충족돼 있다 — auth-service 는 배포 배선이 있고(docker-compose.yml),
      # /api/health 는 필터가 붙지 않는 core-health 라우트로 분리했다.
      #
      # 켜는 절차: 이 값을 true 로 바꾸고 게이트웨이의 /actuator/refresh 를 호출한다.
      # 되돌릴 때 .env(이미지 태그) 롤백으로는 부족하다 — config-server 가 서버의 git
      # 체크아웃을 읽으므로 이 파일을 직접 되돌리고 /actuator/refresh 를 다시 호출해야 한다.
      enabled: true
