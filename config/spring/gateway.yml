# gateway 전용 설정. 시크릿은 여기 두지 않는다.
carix:
  gateway:
    session-validation:
      # 켜져 있으면 세션 쿠키 없는 core 라우트 호출은 전부 401 이다. /api/health 는 필터가
      # 붙지 않는 core-health 라우트라 배포 헬스체크와 무관하다.
      #
      # 되돌릴 때 .env(이미지 태그) 롤백으로는 부족하다 — config-server 가 서버의 git
      # 체크아웃을 읽으므로 이 파일을 직접 되돌리고 게이트웨이 /actuator/refresh 를 호출해야 한다.
      enabled: true
