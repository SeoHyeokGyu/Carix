<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Carix - 로그인</title>
<link rel="stylesheet" href="../_shared.css" />
</head>
<body>
  <div class="hero">
    <h1>Carix</h1>
    <p>이미 계정을 만들었다면 이어서 봅니다.</p>
    <label for="email">이메일</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="8자 이상" />
    <a href="../dashboard.html" class="btn btn-primary">로그인</a>
    <p class="note">계정이 없으면 <a href="../home.html">가입 없이 시작</a>할 수 있습니다.</p>
  </div>
  <p class="note" style="max-width:420px;margin:0 auto;">
    없는 이메일과 비밀번호 불일치를 구분하지 않고 같은 오류를 표시한다 (사용자 정보 열거 방지).
    지금 익명으로 입력한 내용은 로그인하면 이어지지 않는다는 것을 미리 알린다.
  </p>
</body>
</html>
