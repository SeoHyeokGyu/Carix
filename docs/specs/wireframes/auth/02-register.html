<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Carix - 계정 등록</title>
<link rel="stylesheet" href="../_shared.css" />
</head>
<body>
  <div class="hero">
    <h1>결과를 이어서 보기</h1>
    <p>지금까지 입력한 내용을 그대로 두고 계정만 만듭니다.</p>
    <label for="email">이메일</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="8자 이상" />
    <a href="../dashboard.html" class="btn btn-primary">계정 만들기</a>
  </div>
  <p class="note" style="max-width:420px;margin:0 auto;">
    같은 사용자 행을 갱신하므로 데이터와 세션이 그대로 유지된다.
    이미 사용 중인 이메일은 그 사실을 알린다 — 숨기면 사용자가 실패 원인을 알 수 없다.
    비밀번호 재설정은 제공하지 않는다.
  </p>
</body>
</html>
