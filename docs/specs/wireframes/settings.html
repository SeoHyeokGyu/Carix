<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Carix - 계정 설정</title>
<link rel="stylesheet" href="./_shared.css" />
</head>
<body>
<div class="page" style="max-width:640px;">
  <div class="nav">
    <span class="logo">◈ Carix</span>
    <div style="display:flex;gap:16px;align-items:center;">
      <a href="./dashboard.html">대시보드</a>
      <a href="./records.html">기록 관리</a>
      <a href="./settings.html" style="font-weight:600;">설정</a>
      <span class="user">user@example.com</span>
    </div>
  </div>

  <h1>계정 설정</h1>

  <div class="card">
    <h3>세션</h3>
    현재 모든 기기에서 로그인된 상태입니다.
    <div style="margin-top:12px;"><button class="btn">모든 기기에서 로그아웃</button></div>
  </div>

  <div class="card">
    <h3>데이터 삭제</h3>
    계정과 모든 개인 데이터(프로필, 소득, 소비, 스킬 이력, 지수 스냅샷)를 삭제합니다. 이 작업은 되돌릴 수 없습니다.
    <div style="margin-top:12px;"><button class="btn btn-danger">내 데이터 삭제</button></div>
  </div>

  <div class="card" style="border:1px solid #e2e4ea;">
    <h3>정말 삭제하시겠습니까?</h3>
    계정과 모든 개인 데이터가 영구적으로 삭제되며 복구할 수 없습니다.
    <div class="btn-row">
      <button class="btn btn-danger">영구 삭제</button>
      <button class="btn">취소</button>
    </div>
  </div>

  <p class="note">삭제 확인 모달은 [내 데이터 삭제] 클릭 시에만 표시된다.</p>
</div>
</body>
</html>
