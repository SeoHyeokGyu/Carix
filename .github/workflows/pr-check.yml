name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.githooks/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_modules: ${{ steps.set-modules.outputs.modules }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'backend/**'
              - 'config/**'
              - '.github/workflows/pr-check.yml'
            common:
              - 'backend/build.gradle'
              - 'backend/settings.gradle'
              - 'backend/gradle.properties'
              - 'config/**'
              - '.github/workflows/pr-check.yml'
            core_api:
              - 'backend/core-api/**'
            collector:
              - 'backend/collector/**'
            auth_service:
              - 'backend/auth-service/**'
            gateway:
              - 'backend/gateway/**'
            eureka:
              - 'backend/eureka/**'
            config_server:
              - 'backend/config-server/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr-check.yml'

      - name: Compute Changed Backend Modules
        id: set-modules
        if: steps.filter.outputs.backend == 'true'
        run: |
          if [ "${{ steps.filter.outputs.common }}" = "true" ]; then
            MODULES='["core-api", "collector", "auth-service", "gateway", "eureka", "config-server"]'
          else
            MODULES="[]"
            [ "${{ steps.filter.outputs.core_api }}" = "true" ] && MODULES=$(echo $MODULES | jq '. + ["core-api"]')
            [ "${{ steps.filter.outputs.collector }}" = "true" ] && MODULES=$(echo $MODULES | jq '. + ["collector"]')
            [ "${{ steps.filter.outputs.auth_service }}" = "true" ] && MODULES=$(echo $MODULES | jq '. + ["auth-service"]')
            [ "${{ steps.filter.outputs.gateway }}" = "true" ] && MODULES=$(echo $MODULES | jq '. + ["gateway"]')
            [ "${{ steps.filter.outputs.eureka }}" = "true" ] && MODULES=$(echo $MODULES | jq '. + ["eureka"]')
            [ "${{ steps.filter.outputs.config_server }}" = "true" ] && MODULES=$(echo $MODULES | jq '. + ["config-server"]')
          fi
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Test & Lint (${{ matrix.module }})
    needs: filter
    if: needs.filter.outputs.backend == 'true' && needs.filter.outputs.backend_modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: ${{ fromJson(needs.filter.outputs.backend_modules) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Module Tests & Checks
        working-directory: backend
        run: ./gradlew :${{ matrix.module }}:check --build-cache

  frontend:
    name: Frontend Typecheck, Lint & Test
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
          run_install: false

      - name: Setup Node.js 24 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Format Check
        working-directory: frontend
        run: pnpm format:check

      - name: Unit Tests
        working-directory: frontend
        run: pnpm test:unit

      - name: Build Check
        working-directory: frontend
        run: pnpm build
