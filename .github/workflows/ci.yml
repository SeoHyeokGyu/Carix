# Carix CI — PR 게이트.
#
# main 푸시의 테스트·빌드는 deploy.yml이 ARM 러너에서 한 번만 수행한다.
# 같은 Gradle 빌드를 두 번 돌리지 않기 위함이다.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm은 setup-node보다 먼저 설치돼야 한다.
      # setup-node의 `cache: pnpm`이 `pnpm store path`를 실행해 캐시 경로를 구하기 때문이다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Unit test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    # ubuntu-latest 러너는 Docker를 제공하므로 Testcontainers 통합 테스트가 여기서 실행된다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # deploy.yml과 같은 캐시 스킴을 쓴다. setup-java의 `cache: gradle`과 섞으면
      # 캐시 키가 갈라져 같은 의존성이 두 벌 저장되고 저장소당 10GB 한도를 잠식한다.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test (Testcontainers 포함)
        working-directory: backend
        run: ./gradlew build
