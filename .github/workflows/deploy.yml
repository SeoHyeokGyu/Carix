# Carix 배포 — GitHub Actions(ARM 러너)가 이미지를 빌드해 GHCR에 올리고, OCI 서버는 pull만 한다.
# backend/frontend가 스캐폴드되기 전에는 guard 스텝이 나머지를 건너뛴다.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Test & Build backend
    # private 저장소도 ARM 러너 free-tier 대상 (2 vCPU). 서버가 aarch64라 QEMU가 필요 없다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — backend 스캐폴드 여부
        id: guard
        run: |
          if { [ -f backend/build.gradle ] || [ -f backend/build.gradle.kts ]; } && [ -f backend/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "backend 미스캐폴드 — 빌드 건너뜀"
          fi

      - name: Setup Java
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성·빌드 캐시를 GHA 캐시에 보관한다.
      # Dockerfile 안에서 빌드하면 이 캐시를 쓸 수 없어 매번 전체 컴파일이 된다.
      - name: Setup Gradle
        if: steps.guard.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers 통합 테스트가 여기서 돈다. 러너에 Docker가 있고 aarch64라
      # 운영 아키텍처와 일치한다.
      - name: Build & test
        if: steps.guard.outputs.ready == 'true'
        working-directory: backend
        run: ./gradlew build

      - name: Login to GHCR
        if: steps.guard.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile은 컴파일하지 않는다. 위에서 만든 JAR을 layered로 풀어 담기만 한다.
      - name: Build & push image
        if: steps.guard.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false   # GHCR에 unknown/unknown 매니페스트가 생기는 것을 막는다
          sbom: false
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/backend:latest

  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — frontend 스캐폴드 여부
        id: guard
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "frontend 미스캐폴드 — 빌드 건너뜀"
          fi

      - name: Login to GHCR
        if: steps.guard.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 프런트엔드는 Dockerfile 안에서 빌드한다. pnpm은 레이어 캐시가 잘 듣는다.
      # 캐시가 GHA 10GB 한도를 압박하면 mode=min으로 낮춘다 (백엔드 Gradle 캐시와 공유).
      - name: Build & push image
        if: steps.guard.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: needs.backend.outputs.ready == 'true' && needs.frontend.outputs.ready == 'true'
    permissions:
      contents: read
      packages: read   # private 저장소 → GHCR 패키지도 private. 없으면 compose pull이 403
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GH_ACTOR
          script: |
            set -eu   # -x 금지: docker login 라인이 트레이스에 남는다
            cd /opt/carix

            # SHA를 명시적으로 fetch한다. main 팁이 이미 움직였거나 workflow_dispatch를
            # 다른 ref로 돌리면 `fetch origin main`만으로는 그 객체가 안 올 수 있다.
            git fetch --prune origin main
            git fetch origin "$IMAGE_TAG"
            git reset --hard "$IMAGE_TAG"

            # 순서 주의: reset → .env 갱신 → pull.
            # .env는 gitignore 대상이라 reset에 지워지지 않고, compose pull이 이 값을 읽는다.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io

            # 두 Caddy 모두 저장소 파일을 bind-mount한다. compose up만으로는 재적용되지 않는다.
            #   carix_caddy → deploy/caddy/Caddyfile  (애플리케이션 라우팅)
            #   infra_caddy → deploy/caddy/router.caddy (호스트명 분기)
            docker exec carix_caddy caddy reload --config /etc/caddy/Caddyfile
            docker exec infra_caddy caddy reload --config /etc/caddy/Caddyfile

            # 디스크가 빡빡한 호스트다. 매 배포마다 정리한다.
            docker image prune -f

  healthcheck:
    name: Health check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://carix.144.24.90.88.sslip.io/api/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "헬스체크 실패"
          exit 1
